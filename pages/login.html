<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inloggen - StripWereld</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

    <script src="../theme.js"></script>

<body>

<header>
    <a href="../index.html" class="logo">
    <img src="../logo.jpeg" alt="StripWereld" class="logo-afbeelding">
</a>
</header>

<main>

    <h1>🔐 Inloggen</h1>

    <form id="login-form">

        <input
            type="email"
            id="email"
            placeholder="E-mailadres"
            required
        >

        <input
            type="password"
            id="wachtwoord"
            placeholder="Wachtwoord"
            required
        >

        <button
            type="submit"
            class="knop"
        >
            Inloggen
        </button>

    </form>

    <p id="login-status"></p>

    <hr>

    <button
        type="button"
        id="account-maken"
        class="knop"
    >
        ➕ Account aanmaken
    </button>

    <button
        type="button"
        id="wachtwoord-vergeten"
        class="knop"
    >
        🔑 Wachtwoord vergeten
    </button>

</main>

<footer>
    © 2026 StripWereld
</footer>

<script type="module" src="../js/login.js"></script>

</body>
</html>
